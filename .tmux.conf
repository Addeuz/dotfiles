# Set tmux to be index by 1
set -g base-index 1
set -g pane-base-index 1

# Prefix key
unbind C-b
set -g prefix C-f
bind C-f send-prefix

# Fix color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # undercurl colors - needs tmux-3.0

# Let apps send OSC sequences through to the host terminal (e.g. Claude Code
# desktop notifications via OSC 9 reaching ghostty)
set -g allow-passthrough on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Show copy mode indicator in statusbar
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_prompt '[#{scroll_position}/#{history_size}]'
set -g @prefix_highlight_prefix_prompt '󰠠'


# Theme
source ~/.tmux/themes/cobalt2.tmux

# Personal overrides on top of the theme: 24h clock, no hostname, window flag icons
set -g status-right "#[fg=#15232d,bg=#15232d,nobold,nounderscore,noitalics]#[fg=#0088ff,bg=#15232d]#{prefix_highlight}#{?#{||:#{client_prefix},#{pane_in_mode}},#[fg=#0088ff]#[bg=#a5ff90],#[fg=#0088ff]#[bg=#15232d]}#[fg=#142a3a,bg=#0088ff,bold] %Y-%m-%d  %H:%M "
setw -g window-status-format "#[fg=#15232d,bg=#15232d,nobold,nounderscore,noitalics]#[default] #I  #W #{?window_last_flag,󰌑,#{?window_zoomed_flag,Z,#{?window_bell_flag,!,}}} #[fg=#15232d,bg=#15232d,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#15232d,bg=#3b5364,nobold,nounderscore,noitalics]#[fg=#0088ff,bg=#3b5364,bold] #I  #W #{?window_last_flag,󰌑,#{?window_zoomed_flag,Z,#{?window_bell_flag,!,}}} #[fg=#3b5364,bg=#15232d,nobold,nounderscore,noitalics]"

# Vi mode
setw -g mode-keys vi
set -g status-keys vi

# Enter copy mode with PageUp, Ctrl+U, or mouse wheel (pass through when in vim/nvim)
bind -n PageUp if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys PageUp' 'copy-mode -u'
bind -n C-u if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-u' 'copy-mode -u'
set -g mouse on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

